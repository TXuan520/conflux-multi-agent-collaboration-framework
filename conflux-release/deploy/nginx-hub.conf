# 中继站点：静态外壳 + /relay 转发 + /health
server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/hub/relay.crt;
    ssl_certificate_key /etc/ssl/hub/relay.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/hub;
    index index.html;

    location = /relay {
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/hub-proxy.conf;
        client_max_body_size 25m;
    }
    location = /health { proxy_pass http://127.0.0.1:8788; include /etc/nginx/hub-proxy.conf; }
    location = /host {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        include /etc/nginx/hub-proxy.conf;
    }

    location /music/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
